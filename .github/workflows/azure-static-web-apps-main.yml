name: Azure Static Web Apps CI/CD (main / prod)

# Deploys the Theo FE to the vault-theo-prod SWA (ashy-plant-04d99b203) on push to `main`
# (i.e. dev→main promotion). Mirror of the development workflow — same VITE_* .env build — with
# the prod deploy token. vault-origin PROD (kind-tree) mounts Theo from THIS SWA; vault-origin DEV
# (proud-field) mounts the dev SWA (salmon-river). This gives Theo the same dev/prod isolation as
# every other federated remote (sigma/axis/dms/theo-tools/projects).

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      # Same VITE_* build baking as the development workflow (the Theo backends are single apps,
      # not per-env), so the prod build has identical config.
      - name: Create .env for Vite build (from GitHub Secrets)
        shell: bash
        run: |
          cat > .env <<EOF
          VITE_ENTRA_CLIENT_ID=${{ secrets.VITE_ENTRA_CLIENT_ID }}
          VITE_ENTRA_TENANT_ID=${{ secrets.VITE_ENTRA_TENANT_ID }}
          VITE_ENTRA_AUTHORITY=${{ secrets.VITE_ENTRA_AUTHORITY }}
          VITE_ENTRA_API_SCOPE=${{ secrets.VITE_ENTRA_API_SCOPE }}
          VITE_FUNCTIONS_URL=${{ secrets.VITE_FUNCTIONS_URL }}
          VITE_STREAM_FUNCTIONS_URL=${{ secrets.VITE_STREAM_FUNCTIONS_URL }}
          VITE_CHAT_FUNCTIONS_URL=https://vaultgpt-func-chat.azurewebsites.net
          EOF

      - name: Deploy to Azure Static Web Apps (prod)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MAIN }}
          action: "upload"
          app_location: "/"         # repo root
          api_location: ""          # no SWA-managed API in this repo
          output_location: "dist"   # Vite output
          production_branch: "main"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MAIN }}
          action: "close"
          production_branch: "main"
